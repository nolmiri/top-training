<meta name="robots" content="noindex, nofollow">
<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>絶オメガ P5 シグマ散開練習</title><style>body{margin:0;background:#101827;color:#e9eef8;font-family:system-ui,sans-serif}main{max-width:800px;margin:auto;padding:20px}h1{font-size:1.4rem}.muted{color:#aab9d0}.panel{background:#1c293d;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:340px;margin:15px auto}.pair{display:flex;justify-content:space-around;gap:8px}.person{position:relative;background:#35475e;border:2px solid #7285a0;border-radius:12px;width:70px;height:54px;display:grid;place-items:center;font-weight:700}.person.me{border-color:#57d5ff;box-shadow:0 0 0 3px #57d5ff55}.person.red:after{content:'🔴';position:absolute;top:-15px;right:-10px;font-size:20px}.rowpair{grid-column:span 2;display:flex;align-items:center;justify-content:center;gap:12px}.pairmark{width:28px;flex:0 0 28px;text-align:center;color:#f5cc75;font-size:1.45rem;font-weight:700}.pairpeople{display:flex;justify-content:space-around;gap:16px;flex:1;max-width:220px}.pairspacer{width:28px;flex:0 0 28px;text-align:center;color:#f5cc75;font-size:1.45rem;font-weight:700}.person.red:after{display:none}.revealed .person.red:after{display:block}.arena{position:relative;max-width:420px;aspect-ratio:1;margin:16px auto;border:2px solid #667a96;border-radius:50%;background:radial-gradient(circle,#25354b,#172437)}.spot{position:absolute;transform:translate(-50%,-50%);border:1px solid #b5c3d9;background:#354962;color:white;border-radius:12px;min-width:64px;padding:12px 4px;cursor:pointer;font-weight:bold}.spot:disabled{opacity:.65}.spot:hover:not(:disabled){background:#42688b}.spot.correct{background:#18774e;border-color:#70f0ae}.spot.wrong{background:#a43c47;border-color:#ff9ba3}button{font:inherit}#start,#next{background:#438ae4;color:white;border:0;padding:12px 22px;border-radius:10px;font-weight:bold;cursor:pointer}.stat{display:flex;gap:20px}.status{min-height:50px;line-height:1.6}.status.result{margin:16px 0;padding:18px;border-radius:14px;border:3px solid;text-align:center;animation:pop .22s ease-out}.status.success{background:#104d35;border-color:#57ef9b;color:#fff}.status.failure{background:#69212c;border-color:#ff7785;color:#fff}.result-title{font-size:2rem;font-weight:900;letter-spacing:.04em}.result-time{font-size:1.2rem;font-weight:800;margin:6px 0}.result-detail{font-size:.95rem;line-height:1.6}.spot.correct{box-shadow:0 0 0 4px #59ffa477,0 0 24px #59ffa488}.spot.wrong{box-shadow:0 0 0 4px #ff5e7377}@keyframes pop{from{transform:scale(.94);opacity:.5}to{transform:scale(1);opacity:1}}.countdown{font-size:2.4rem;font-weight:900;color:#f5cc75;text-align:center;min-height:3rem}.note{font-size:.85rem;color:#afc0d8}strong{color:#79d9ff}</style></head><body><main><h1>絶オメガ P5 シグマ｜散開位置練習</h1><p class="muted">自分の初期位置と赤マーカーは毎回ランダム。正しい散開先をクリックしてください。</p><div class="panel"><div class="stat"><span>問題 <strong id="count">1</strong></span><span>正解 <strong id="score">0</strong></span></div><div style="margin:16px 0"><button id="start" type="button">スタート</button></div><h2 style="font-size:1.05rem">① 初期整列（北外周にオメガM）</h2><div style="text-align:center;color:#f5cc75">▼ オメガM（北）</div><div class="grid" id="lineup"></div><p class="note">青い枠が自分。スタートを押すと3秒のカウントダウン後に赤マーカーが表示されます。各段の左右2人がペア。</p></div><div class="panel"><h2 style="font-size:1.05rem">② 散開先を選ぶ</h2><div class="arena" id="arena"></div><div class="status" id="status" aria-live="polite">正しい位置を選択してください。</div><button id="next" type="button">次の問題 →</button></div><p class="note">ルール：赤2人のペアは北から❶❷。❶は左が北・右が南、❷は左が西・右が東。赤1人のペアは北から①②。①は赤なしが北東・赤ありが南西、②は赤なしが北西・赤ありが南東。赤なし2人が同じ段になる問題は出ません。</p></main><script>const labels=['北西','北','北東','西','東','南西','南','南東'];const coords=[[18,18],[50,10],[82,18],[10,50],[90,50],[18,82],[50,90],[82,82]];let count=0,score=0,answer='',done=false,detail='',started=false,startTime=0,countdownTimer=null,countdownToken=0;function newQuestion(){countdownToken++;if(countdownTimer!==null){clearInterval(countdownTimer);countdownTimer=null}count++;done=false;started=false;startTime=0;document.getElementById('count').textContent=count;const rows=[0,1,2,3];for(let i=3;i>0;i--){let j=Math.floor(Math.random()*(i+1));[rows[i],rows[j]]=[rows[j],rows[i]]}const noRedRows=rows.slice(0,2);const noRed=new Set(noRedRows.map(r=>r*2+Math.floor(Math.random()*2)));const me=Math.floor(Math.random()*8);const redPairs=[0,1,2,3].filter(r=>!noRedRows.includes(r));const mixedPairs=[...noRedRows].sort((a,b)=>a-b);const r=Math.floor(me/2),right=me%2===1,red=!noRed.has(me);let category;if(redPairs.includes(r)){const rank=redPairs.indexOf(r)+1;category='赤2人ペア❶❷の'+(rank===1?'❶':'❷');answer=rank===1?(right?'南':'北'):(right?'東':'西')}else{const rank=mixedPairs.indexOf(r)+1;category='赤1人ペア①②の'+(rank===1?'①':'②');answer=rank===1?(red?'南西':'北東'):(red?'南東':'北西')}detail=`あなたは北から${r+1}段目の${right?'右':'左'}、${red?'赤あり':'赤なし'}。${category}なので正解は「${answer}」。`;const line=document.getElementById('lineup');line.innerHTML='';for(let row=0;row<4;row++){let div=document.createElement('div');div.className='rowpair';let mark=document.createElement('span');mark.className='pairmark';mark.textContent=['○','×','△','□'][row];div.appendChild(mark);let people=document.createElement('div');people.className='pairpeople';for(let side=0;side<2;side++){let id=row*2+side,p=document.createElement('div');p.className='person'+(noRed.has(id)?'':' red')+(id===me?' me':'');p.textContent=id===me?'自分':` ${row+1}${side?'右':'左'}`;people.appendChild(p)}div.appendChild(people);let spacer=document.createElement('span');spacer.className='pairspacer';spacer.textContent=['○','×','△','□'][row];div.appendChild(spacer);line.appendChild(div)}const arena=document.getElementById('arena');arena.innerHTML='';labels.forEach((label,i)=>{let b=document.createElement('button');b.className='spot';b.textContent=label;b.style.left=coords[i][0]+'%';b.style.top=coords[i][1]+'%';b.disabled=true;b.onclick=()=>choose(label,b);arena.appendChild(b)});document.getElementById('lineup').classList.remove('revealed');document.getElementById('start').disabled=false;document.getElementById('start').textContent='スタート';document.getElementById('status').className='status';document.getElementById('status').textContent='スタートを押してください。'}function startQuestion(){if(started)return;started=true;const token=++countdownToken;const start=document.getElementById('start');const status=document.getElementById('status');start.disabled=true;status.className='status countdown';let remaining=3;status.textContent=String(remaining);start.textContent='開始まで 3';countdownTimer=setInterval(()=>{if(token!==countdownToken){clearInterval(countdownTimer);countdownTimer=null;return}remaining--;if(remaining>0){status.textContent=String(remaining);start.textContent='開始まで '+remaining;return}clearInterval(countdownTimer);countdownTimer=null;document.getElementById('lineup').classList.add('revealed');document.querySelectorAll('.spot').forEach(b=>b.disabled=false);start.textContent='回答中';status.className='status';status.textContent='正しい位置を選択してください。';startTime=performance.now()},1000)}function choose(label,btn){if(done||!started||!startTime)return;done=true;const elapsed=((performance.now()-startTime)/1000).toFixed(2);let correct=label===answer;if(correct)score++;document.getElementById('score').textContent=score;document.querySelectorAll('.spot').forEach(b=>{b.disabled=true;if(b.textContent===answer)b.classList.add('correct')});if(!correct)btn.classList.add('wrong');const status=document.getElementById('status');status.className='status result '+(correct?'success':'failure');status.innerHTML='<div class="result-title">'+(correct?'✓ 正解！':'✕ 不正解！')+'</div><div class="result-time">⏱ '+elapsed+' 秒</div><div class="result-detail">'+(correct?'':'選択：'+label+' ／ ') +detail+'</div>'}document.getElementById('next').onclick=newQuestion;document.getElementById('start').onclick=startQuestion;newQuestion();</script></body></html>
